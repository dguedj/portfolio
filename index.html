<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Déborah Guedj</title>


    <style>

        /* ==================================================
           RESET
        ================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {
            background: #E8D3C5;
            color: white;
            font-family: Arial, sans-serif;
        }


        /* ==================================================
           TITRES
        ================================================== */

        h1 {
            font-family: Georgia, serif;
            font-style: italic;
            font-weight: normal;
            font-size: 50px;
        }


        /* ==================================================
           NAVIGATION
        ================================================== */

        nav {
            position: fixed;
            top: 0;
            left: 0;

            width: 100%;
            height: 75px;

            display: flex;
            align-items: center;

            padding: 0 60px;

            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0.7));

            z-index: 1000;
        }



        .nav-links {
            display: flex;
            align-items: center;

            gap: 30px;

            list-style: none;

            margin-left: auto;
        }


        .nav-links a {
            color: rgb(13, 1, 54);

            text-decoration: none;

            font-size: 15px;

            transition: opacity 0.3s ease;
        }


        .nav-links a:hover {
            opacity: 0.5;
        }


        /* ==================================================
           BOUTON MUSIQUE
        ================================================== */

        #music-button {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 42px;
            height: 42px;

            padding: 0;

            background: rgb(255, 252, 252);

            border: 1px solid rgb(13, 1, 54);
            border-radius: 50%;

            color: rgb(13, 1, 54);

            font-size: 18px;

            cursor: pointer;

            transition: all 0.3s ease;
        }


        #music-button:hover {
            background: rgb(13, 1, 54);
            color: white;

            transform: scale(1.08);
        }


        #music-button.playing {
            background: rgb(13, 1, 54);
            color: white;
        }


        /* ==================================================
           LECTEUR YOUTUBE INVISIBLE
        ================================================== */

        #youtube-player {
            position: fixed;

            width: 1px;
            height: 1px;

            left: -9999px;
            top: -9999px;

            opacity: 0;

            pointer-events: none;
        }


        /* ==================================================
           ACCUEIL
        ================================================== */

        #accueil {
                min-height: 100vh;
            
                display: flex;
                flex-direction: column;
            
                justify-content: center;
                align-items: center;
            
                text-align: center;
            
                padding: 100px 20px 50px;
            
                /* Nouveau : image de fond */
                background-image: url("backg.webp");
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
            }


        #accueil h1 {
            font-size: clamp(45px, 8vw, 100px);

            margin-bottom: 20px;
        }


        /* ==================================================
           ANIMATION DES TEXTES
        ================================================== */

        .animate {
            opacity: 0;

            transform: translateY(50px);

            animation: slideUp 1s ease forwards;
        }


        .delay-1 {
            animation-delay: 0.3s;
        }


        .delay-2 {
            animation-delay: 0.6s;
        }


        @keyframes slideUp {

            from {
                opacity: 0;
                transform: translateY(50px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* ==================================================
           CV
        ================================================== */

        #cv {
            min-height: 100vh;

            padding: 120px 60px;

            display: flex;

            justify-content: center;
            align-items: center;

            text-align: center;
        }


        .cv-container {
            width: 100%;
            max-width: 1000px;
        }


        .cv-container h1 {
            margin-bottom: 20px;
        }


        .cv-container p {
            color: rgb(13, 1, 54);

            font-size: 17px;

            margin-bottom: 30px;
        }


        /* ==================================================
           BOUTONS CV
        ================================================== */

        .cv-buttons {
            display: flex;

            justify-content: center;

            gap: 15px;

            margin-bottom: 40px;
        }


        .cv-button {
            display: inline-block;

            padding: 13px 25px;

            background: rgb(13, 1, 54);
            color: white;

            text-decoration: none;

            border-radius: 30px;

            transition: all 0.3s ease;
        }


        .cv-button:hover {
            transform: translateY(-2px);

            opacity: 0.85;
        }


        .cv-button-secondary {
            background: transparent;

            color: rgb(13, 1, 54);

            border: 1px solid rgb(13, 1, 54);
        }


        /* ==================================================
           APERÇU DU CV
        ================================================== */

        .cv-preview {
            width: 100%;
            height: 700px;

            background: white;

            border-radius: 10px;

            overflow: hidden;

            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.15);
        }


        .cv-preview iframe {
            width: 100%;
            height: 100%;

            border: none;
        }


        /* ==================================================
           GALERIE
        ================================================== */

        #galerie {
            min-height: 100vh;
            padding: 120px 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }


        #galerie h1 {
            margin-bottom: 50px;
        }


        /* ==================================================
           CARROUSEL
        ================================================== */

        .carousel {
            position: relative;

            width: 100%;
            max-width: 900px;

            height: 500px;

            margin: 0 auto;

            overflow: hidden;

            border-radius: 10px;
        }


        .carousel-track {
            display: flex;

            width: 100%;
            height: 100%;

            transition:
                transform 0.8s ease-in-out;
        }


        .slide {
            flex: 0 0 100%;

            width: 100%;
            height: 100%;

            object-fit: contain;

            cursor: pointer;

            transition:
                transform 0.3s ease;
        }


        .slide:hover {
            transform: scale(1.02);
        }


        /* ==================================================
           BOUTONS CARROUSEL
        ================================================== */

        .carousel-button {
            position: absolute;

            top: 50%;

            transform: translateY(-50%);

            width: 45px;
            height: 45px;

            display: flex;

            align-items: center;
            justify-content: center;

            border: none;
            border-radius: 50%;

            background: rgba(255, 255, 255, 0.8);

            color: rgb(13, 1, 54);

            font-size: 25px;

            cursor: pointer;

            z-index: 10;

            transition: all 0.3s ease;
        }


        .carousel-button:hover {
            background: white;

            transform:
                translateY(-50%)
                scale(1.08);
        }


        .carousel-button.previous {
            left: 20px;
        }


        .carousel-button.next {
            right: 20px;
        }


        /* ==================================================
           LIGHTBOX
        ================================================== */

        .lightbox {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            display: flex;

            align-items: center;
            justify-content: center;

            padding: 40px;

            background: rgba(0, 0, 0, 0.88);

            z-index: 2000;

            opacity: 0;
            visibility: hidden;

            transition:
                opacity 0.3s ease,
                visibility 0.3s ease;
        }


        .lightbox.active {
            opacity: 1;
            visibility: visible;
        }


        .lightbox img {
            max-width: 90%;
            max-height: 90%;

            object-fit: contain;

            border-radius: 8px;

            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.5);

            transform: scale(0.9);

            transition:
                transform 0.3s ease;
        }


        .lightbox.active img {
            transform: scale(1);
        }


        /* ==================================================
           BOUTON FERMER LIGHTBOX
        ================================================== */

        .lightbox-close {
            position: absolute;

            top: 25px;
            right: 35px;

            background: none;
            border: none;

            color: white;

            font-size: 45px;
            font-weight: 300;

            cursor: pointer;

            z-index: 2001;

            transition:
                transform 0.2s ease;
        }


        .lightbox-close:hover {
            transform: scale(1.15);
        }


        /* ==================================================
           BOUTONS LIGHTBOX
        ================================================== */

        .lightbox-button {
            position: absolute;

            top: 50%;

            transform: translateY(-50%);

            width: 50px;
            height: 50px;

            display: flex;

            align-items: center;
            justify-content: center;

            border: none;
            border-radius: 50%;

            background: rgba(255, 255, 255, 0.85);

            color: rgb(13, 1, 54);

            font-size: 28px;

            cursor: pointer;

            z-index: 2001;

            transition: all 0.3s ease;
        }


        .lightbox-button:hover {
            background: white;

            transform:
                translateY(-50%)
                scale(1.08);
        }


        .lightbox-button.previous {
            left: 25px;
        }


        .lightbox-button.next {
            right: 25px;
        }


        /* ==================================================
           MES PROJETS
        ================================================== */

        #mes-projets {
            min-height: 100vh;

            padding: 120px 60px;

            display: flex;

            justify-content: center;
            align-items: center;

            text-align: center;
        }


        #mes-projets a {
            color: rgb(13, 1, 54);

            font-size: 18px;

            text-decoration: none;
        }


        #mes-projets a:hover {
            text-decoration: underline;
        }


        /* ==================================================
           CONTACT
        ================================================== */

        #contact {
            min-height: 60vh;

            padding: 120px 60px;

            display: flex;

            justify-content: center;
            align-items: center;

            text-align: center;
        }


        #contact a {
            color: rgb(13, 1, 54);

            font-size: 20px;

            text-decoration: none;
        }


        #contact a:hover {
            text-decoration: underline;
        }


        /* ==================================================
           FOOTER
        ================================================== */

        footer {
                padding: 30px;
                text-align: center;
                color: #11032d;
                background-image: 
                    linear-gradient(rgba(255, 255, 255, 0.7), rgba(255, 255, 255, 0.7)),
                    url('footer.jpg');
                background-size: cover;
                background-position: center;
                background-repeat: no-repeat;
        }

            .footer-logo {
                width: 100px;      /* ajuste selon tes besoins */
                height: auto;
                margin-bottom: 15px;  /* espace entre l'image et le texte en dessous */
                display: block;
                margin-left: auto;
                margin-right: auto;   /* centre l'image */
            }


        /* ==================================================
           RESPONSIVE MOBILE
        ================================================== */

        @media (max-width: 700px) {

            nav {
                padding: 0 20px;
            }


            .nav-links {
                gap: 15px;
            }


            .nav-links a {
                font-size: 13px;
            }


            #cv,
            #galerie,
            #mes-projets,
            #contact {
                padding-left: 20px;
                padding-right: 20px;
            }


            #cv h1,
            #galerie h1,
            #mes-projets h1,
            #contact h1 {
                font-size: 40px;
            }


            /* ---------- CV ---------- */

            .cv-buttons {
                flex-direction: column;

                align-items: center;
            }


            .cv-button {
                width: 220px;
            }


            .cv-preview {
                height: 500px;
            }


            /* ---------- CARROUSEL ---------- */

            .carousel {
                height: 400px;
            }


            .carousel-button {
                width: 38px;
                height: 38px;

                font-size: 20px;
            }


            .carousel-button.previous {
                left: 10px;
            }


            .carousel-button.next {
                right: 10px;
            }


            /* ---------- LIGHTBOX ---------- */

            .lightbox {
                padding: 20px;
            }


            .lightbox img {
                max-width: 95%;
                max-height: 85%;
            }


            .lightbox-button {
                width: 40px;
                height: 40px;

                font-size: 22px;
            }


            .lightbox-button.previous {
                left: 10px;
            }


            .lightbox-button.next {
                right: 10px;
            }


            .lightbox-close {
                top: 15px;
                right: 20px;

                font-size: 35px;
            }

        }

    </style>

</head>

    <!-- ==================================================

    ================================================== -->

    <script
        src="https://www.youtube.com/iframe_api">
    </script>


    <!-- ==================================================
         JAVASCRIPT
    ================================================== -->

    <script>


        /* ==================================================
           MUSIQUE YOUTUBE
        ================================================== */

        let youtubePlayer = null;

        let isMusicPlaying = false;


        /*
            Cette fonction est automatiquement appelée
            par l'API YouTube lorsque celle-ci est chargée.
        */

        function onYouTubeIframeAPIReady() {

            youtubePlayer = new YT.Player(
                "youtube-player",
                {

                    videoId: "NPBCbTZWnq0",

                    playerVars: {

                        autoplay: 0,

                        controls: 0,

                        loop: 1,

                        playlist: "NPBCbTZWnq0",

                        rel: 0

                    },

                    events: {

                        onReady: function () {

                            console.log(
                                "Lecteur YouTube prêt."
                            );

                        },


                        onStateChange:
                            function (event) {

                                /*
                                    La musique joue.
                                */

                                if (
                                    event.data ===
                                    YT.PlayerState.PLAYING
                                ) {

                                    isMusicPlaying = true;

                                    musicIcon.textContent =
                                        "♫";

                                    musicButton.classList.add(
                                        "playing"
                                    );

                                }


                                /*
                                    La musique est arrêtée
                                    ou mise en pause.
                                */

                                if (
                                    event.data ===
                                    YT.PlayerState.PAUSED ||
                                    event.data ===
                                    YT.PlayerState.ENDED
                                ) {

                                    isMusicPlaying = false;

                                    musicIcon.textContent =
                                        "🔇";

                                    musicButton.classList.remove(
                                        "playing"
                                    );

                                }

                            }

                    }

                }
            );

        }


        /* ==================================================
           BOUTON MUSIQUE
        ================================================== */

        const musicButton =
            document.getElementById(
                "music-button"
            );


        const musicIcon =
            musicButton.querySelector(
                ".music-icon"
            );


        musicButton.addEventListener(
            "click",
            function () {

                /*
                    Vérifie que le lecteur YouTube
                    est prêt.
                */

                if (!youtubePlayer) {

                    console.log(
                        "Le lecteur YouTube n'est pas encore prêt."
                    );

                    return;

                }


                /*
                    Si la musique joue :
                    → pause.
                */

                if (isMusicPlaying) {

                    youtubePlayer.pauseVideo();

                }


                /*
                    Sinon :
                    → lecture.
                */

                else {

                    youtubePlayer.playVideo();

                }

            }
        );


        /* ==================================================
           CARROUSEL
        ================================================== */

        const slides =
            document.querySelectorAll(
                ".slide"
            );


        const carouselTrack =
            document.getElementById(
                "carousel-track"
            );


        const previousButton =
            document.getElementById(
                "previous-button"
            );


        const nextButton =
            document.getElementById(
                "next-button"
            );


        let currentSlide = 0;

        let isMoving = false;


        /* --------------------------------------------------
           PHOTO SUIVANTE
        -------------------------------------------------- */

        function nextSlide() {

            if (isMoving) {
                return;
            }


            isMoving = true;

            currentSlide++;


            carouselTrack.style.transition =
                "transform 0.8s ease-in-out";


            carouselTrack.style.transform =
                `translateX(-${currentSlide * 100}%)`;


            /*
                Dernière image = copie de la première.
            */

            if (
                currentSlide ===
                slides.length - 1
            ) {

                setTimeout(
                    function () {

                        carouselTrack.style.transition =
                            "none";


                        currentSlide = 0;


                        carouselTrack.style.transform =
                            "translateX(0)";


                        carouselTrack.offsetHeight;


                        carouselTrack.style.transition =
                            "transform 0.8s ease-in-out";


                        isMoving = false;

                    },
                    800
                );

            }

            else {

                setTimeout(
                    function () {

                        isMoving = false;

                    },
                    800
                );

            }

        }


        /* --------------------------------------------------
           PHOTO PRÉCÉDENTE
        -------------------------------------------------- */

        function previousSlide() {

            if (
                isMoving ||
                currentSlide === 0
            ) {
                return;
            }


            isMoving = true;

            currentSlide--;


            carouselTrack.style.transition =
                "transform 0.8s ease-in-out";


            carouselTrack.style.transform =
                `translateX(-${currentSlide * 100}%)`;


            setTimeout(
                function () {

                    isMoving = false;

                },
                800
            );

        }


        /* --------------------------------------------------
           BOUTONS CARROUSEL
        -------------------------------------------------- */

        nextButton.addEventListener(
            "click",
            nextSlide
        );


        previousButton.addEventListener(
            "click",
            previousSlide
        );


        /* --------------------------------------------------
           DÉFILEMENT AUTOMATIQUE
        -------------------------------------------------- */

        setInterval(
            function () {

                nextSlide();

            },
            4000
        );


        /* ==================================================
           LIGHTBOX
        ================================================== */

        const lightbox =
            document.getElementById(
                "lightbox"
            );


        const lightboxImage =
            document.getElementById(
                "lightbox-image"
            );


        const lightboxClose =
            document.getElementById(
                "lightbox-close"
            );


        const lightboxPrevious =
            document.getElementById(
                "lightbox-previous"
            );


        const lightboxNext =
            document.getElementById(
                "lightbox-next"
            );


        let lightboxSlide = 0;


        /* --------------------------------------------------
           OUVRIR UNE IMAGE
        -------------------------------------------------- */

        slides.forEach(
            function (slide, index) {

                /*
                    La dernière image est uniquement
                    la copie utilisée pour la boucle.
                */

                if (
                    index >=
                    slides.length - 1
                ) {
                    return;
                }


                slide.addEventListener(
                    "click",
                    function () {

                        lightboxSlide = index;

                        updateLightbox();

                        lightbox.classList.add(
                            "active"
                        );

                    }
                );

            }
        );


        /* --------------------------------------------------
           METTRE À JOUR L'IMAGE
        -------------------------------------------------- */

        function updateLightbox() {

            lightboxImage.src =
                slides[lightboxSlide].src;


            lightboxImage.alt =
                slides[lightboxSlide].alt;

        }


        /* --------------------------------------------------
           PHOTO SUIVANTE LIGHTBOX
        -------------------------------------------------- */

        lightboxNext.addEventListener(
            "click",
            function (event) {

                event.stopPropagation();


                lightboxSlide++;


                if (
                    lightboxSlide >=
                    slides.length - 1
                ) {

                    lightboxSlide = 0;

                }


                updateLightbox();

            }
        );


        /* --------------------------------------------------
           PHOTO PRÉCÉDENTE LIGHTBOX
        -------------------------------------------------- */

        lightboxPrevious.addEventListener(
            "click",
            function (event) {

                event.stopPropagation();


                lightboxSlide--;


                if (lightboxSlide < 0) {

                    lightboxSlide =
                        slides.length - 2;

                }


                updateLightbox();

            }
        );


        /* --------------------------------------------------
           FERMER LIGHTBOX
        -------------------------------------------------- */

        function closeLightbox() {

            lightbox.classList.remove(
                "active"
            );

        }


        lightboxClose.addEventListener(
            "click",
            closeLightbox
        );


        /* --------------------------------------------------
           FERMER EN CLIQUANT SUR LE FOND
        -------------------------------------------------- */

        lightbox.addEventListener(
            "click",
            function (event) {

                if (
                    event.target === lightbox
                ) {

                    closeLightbox();

                }

            }
        );


        /* --------------------------------------------------
           NAVIGATION AU CLAVIER
        -------------------------------------------------- */

        document.addEventListener(
            "keydown",
            function (event) {

                /*
                    Fermer avec Échap.
                */

                if (
                    event.key === "Escape"
                ) {

                    closeLightbox();

                }


                /*
                    Image suivante.
                */

                if (
                    lightbox.classList.contains(
                        "active"
                    ) &&
                    event.key === "ArrowRight"
                ) {

                    lightboxNext.click();

                }


                /*
                    Image précédente.
                */

                if (
                    lightbox.classList.contains(
                        "active"
                    ) &&
                    event.key === "ArrowLeft"
                ) {

                    lightboxPrevious.click();

                }

            }
        );

    </script>


</body>

</html>
